{% extends "base.html" %}

{% block title %}Connexion · UniScheduler{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow-sm border-0" style="max-width: 420px; width: 100%;">
        <div class="card-body p-5">
            <div class="text-center mb-4"><i class="bi bi-calendar-event" style="color: var(--ms-blue); font-size: 3rem;"></i><h1 class="h3 fw-bold mt-2">University Scheduler</h1><p class="text-muted">Gestion des emplois du temps</p></div>
            <form method="post" action="{{ url_for('login') }}">
                <div class="mb-3"><label for="username" class="form-label fw-semibold">Nom d'utilisateur</label><input class="form-control form-control-lg" id="username" name="username" placeholder="admin" autocomplete="username" required autofocus></div>
                <div class="mb-3"><label for="password" class="form-label fw-semibold">Mot de passe</label><input type="password" class="form-control form-control-lg" id="password" name="password" autocomplete="current-password" required></div>
                <button type="submit" class="btn btn-primary btn-lg w-100" style="background-color: var(--ms-blue);">Se connecter</button>
            </form>
            <hr class="my-4"><p class="text-center text-muted small mb-0">Comptes de démonstration : <strong>admin</strong> / <strong>admin123</strong><br>ou <strong>prof_dupont</strong> / <strong>password</strong></p>
        </div>
    </div>
</div>
{% endblock %}
